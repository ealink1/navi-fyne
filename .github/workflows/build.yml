name: Build native application packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (for example 0.1.0)'
        default: '0.1.0'
        required: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
      SUPERLINK_RELEASE_PUBLIC_KEY: ${{ vars.SUPERLINK_RELEASE_PUBLIC_KEY }}
      SUPERLINK_BUILD_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true
      - name: Linux Fyne dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Windows CGO compiler
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add Windows compiler to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SUPERLINK_MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: 'Join-Path $env:SUPERLINK_MSYS2_LOCATION "ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Build and probe all drivers
        shell: bash
        run: python tools/build.py --all-drivers --package --version "$SUPERLINK_BUILD_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          retention-days: 14
